<style>
/* USB Sentinel Enterprise Security Console Design System */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  /* Core Color Palette */
  --bg-main: #F1F6FC;
  --bg-surface: #FFFFFF;
  --bg-surface-subtle: #F8FAFC;
  --bg-sidebar: #10243E;
  --bg-sidebar-hover: #193653;
  --bg-sidebar-active: #1E4068;
  
  --border-color: #D8E3F0;
  --border-color-subtle: #E2E8F0;
  
  --text-primary: #172B45;
  --text-secondary: #64748B;
  --text-muted: #94A3B8;
  --text-sidebar: #CBD5E1;
  --text-sidebar-bright: #FFFFFF;
  
  --primary-blue: #2563EB;
  --primary-blue-hover: #1D4ED8;
  --primary-blue-light: #E5F0FF;
  --primary-blue-border: #BFDBFE;
  
  --status-success: #15803D;
  --status-success-bg: #DCFCE7;
  --status-success-border: #86EFAC;
  
  --status-warning: #B45309;
  --status-warning-bg: #FEF3C7;
  --status-warning-border: #FCD34D;
  
  --status-critical: #B91C1C;
  --status-critical-bg: #FEE2E2;
  --status-critical-border: #FCA5A5;

  --status-neutral: #475569;
  --status-neutral-bg: #F1F5F9;
  --status-neutral-border: #CBD5E1;
  
  /* Typography */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  
  /* Shadows & Radius */
  --shadow-sm: 0 1px 2px 0 rgba(16, 36, 62, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(16, 36, 62, 0.08), 0 2px 4px -1px rgba(16, 36, 62, 0.04);
  --shadow-lg: 0 10px 15px -3px rgba(16, 36, 62, 0.08), 0 4px 6px -2px rgba(16, 36, 62, 0.04);
  
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
}

/* Reset and Base Styles */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-main);
  color: var(--text-primary);
  line-height: 1.5;
  font-size: 14px;
  min-height: 100vh;
  display: flex;
}

/* Layout Architecture */
.app-layout {
  display: flex;
  width: 100%;
  min-height: 100vh;
}

/* Sidebar Navigation */
.app-sidebar {
  width: 256px;
  background-color: var(--bg-sidebar);
  color: var(--text-sidebar);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  border-right: 1px solid rgba(255, 255, 255, 0.08);
}

.sidebar-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon-wrapper {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #FFFFFF;
  box-shadow: 0 2px 6px rgba(37, 99, 235, 0.4);
}

.brand-title {
  font-size: 16px;
  font-weight: 700;
  color: #FFFFFF;
  letter-spacing: -0.02em;
  display: flex;
  flex-direction: column;
}

.brand-subtitle {
  font-size: 10px;
  font-weight: 600;
  color: #93C5FD;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.sidebar-nav {
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}

.nav-section-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  color: #64748B;
  padding: 8px 10px 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  color: var(--text-sidebar);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  border-radius: var(--radius-md);
  transition: all 0.15s ease-in-out;
}

.nav-item:hover {
  background-color: var(--bg-sidebar-hover);
  color: var(--text-sidebar-bright);
}

.nav-item.active {
  background-color: var(--primary-blue);
  color: #FFFFFF;
  font-weight: 600;
  box-shadow: 0 2px 4px rgba(37, 99, 235, 0.25);
}

.nav-item svg {
  width: 18px;
  height: 18px;
  opacity: 0.85;
  flex-shrink: 0;
}

.nav-item.active svg {
  opacity: 1;
}

.sidebar-footer {
  padding: 16px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  font-size: 11px;
  color: #94A3B8;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.sidebar-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  background-color: rgba(255, 255, 255, 0.06);
  color: #CBD5E1;
  font-size: 11px;
  font-family: var(--font-mono);
}

/* Main Content Area */
.app-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background-color: var(--bg-main);
  overflow-y: auto;
}

/* Top Bar */
.topbar {
  background-color: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
  padding: 12px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 20;
}

.page-breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
}

.breadcrumb-root {
  font-weight: 500;
  color: var(--text-muted);
}

.breadcrumb-separator {
  color: var(--border-color);
}

.breadcrumb-current {
  font-weight: 600;
  color: var(--text-primary);
}

.topbar-indicators {
  display: flex;
  align-items: center;
  gap: 16px;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 9999px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid transparent;
}

.status-pill.active {
  background-color: var(--status-success-bg);
  color: var(--status-success);
  border-color: var(--status-success-border);
}

.status-pill.inactive {
  background-color: var(--status-neutral-bg);
  color: var(--status-neutral);
  border-color: var(--status-neutral-border);
}

.status-indicator-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background-color: currentColor;
}

.status-pill.active .status-indicator-dot {
  animation: pulse-green 2s infinite ease-in-out;
}

@keyframes pulse-green {
  0% { transform: scale(0.95); opacity: 0.8; }
  50% { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(0.95); opacity: 0.8; }
}

/* Page Container */
.page-container {
  padding: 24px 28px 40px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  max-width: 1400px;
}

/* Page Header */
.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 4px;
}

.page-header-text h1 {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}

.page-header-text p {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 3px;
}

.page-header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Alerts and Flashes */
.flash-container {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.alert-banner {
  padding: 10px 14px;
  border-radius: var(--radius-md);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid transparent;
}

.alert-banner.info {
  background-color: var(--primary-blue-light);
  color: var(--primary-blue-hover);
  border-color: var(--primary-blue-border);
}

.alert-banner.success {
  background-color: var(--status-success-bg);
  color: var(--status-success);
  border-color: var(--status-success-border);
}

.alert-banner.warning {
  background-color: var(--status-warning-bg);
  color: var(--status-warning);
  border-color: var(--status-warning-border);
}

.alert-banner.error {
  background-color: var(--status-critical-bg);
  color: var(--status-critical);
  border-color: var(--status-critical-border);
}

.alert-banner svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

/* Security Policy Callout Banner */
.policy-banner {
  background: linear-gradient(90deg, #F8FAFC 0%, #F1F5F9 100%);
  border: 1px solid var(--border-color);
  border-left: 4px solid var(--primary-blue);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  font-size: 12px;
  color: var(--text-secondary);
}

.policy-banner strong {
  color: var(--text-primary);
}

/* Metrics and KPI Grid */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 16px;
}

.metric-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.metric-card:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.metric-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.metric-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.metric-icon-wrap {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
}

.metric-icon-blue { background-color: var(--primary-blue-light); color: var(--primary-blue); }
.metric-icon-green { background-color: var(--status-success-bg); color: var(--status-success); }
.metric-icon-amber { background-color: var(--status-warning-bg); color: var(--status-warning); }
.metric-icon-red { background-color: var(--status-critical-bg); color: var(--status-critical); }
.metric-icon-slate { background-color: var(--status-neutral-bg); color: var(--status-neutral); }

.metric-value {
  font-size: 26px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.1;
  font-family: var(--font-mono);
}

.metric-subtext {
  font-size: 11px;
  color: var(--text-muted);
}

/* Standard Panels & Cards */
.panel {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.panel-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background-color: var(--bg-surface);
}

.panel-title-group {
  display: flex;
  align-items: center;
  gap: 10px;
}

.panel-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}

.panel-subtitle {
  font-size: 12px;
  color: var(--text-secondary);
}

.panel-body {
  padding: 20px;
}

.panel-body-flush {
  padding: 0;
}

.panel-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border-color-subtle);
  background-color: var(--bg-surface-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Two-Column & Grid Layouts */
.grid-2col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.grid-3col {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 20px;
}

/* Tables */
.table-responsive {
  width: 100%;
  overflow-x: auto;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  text-align: left;
}

.data-table th {
  background-color: #F8FAFC;
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-color);
  white-space: nowrap;
}

.data-table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-color-subtle);
  color: var(--text-primary);
  vertical-align: middle;
}

.data-table tr:last-child td {
  border-bottom: none;
}

.data-table tbody tr:hover {
  background-color: #F8FAFC;
}

.mono {
  font-family: var(--font-mono);
  font-size: 12px;
}

.text-break {
  word-break: break-all;
}

/* Status Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 600;
  line-height: 1.4;
  white-space: nowrap;
}

.badge-success {
  background-color: var(--status-success-bg);
  color: var(--status-success);
  border: 1px solid var(--status-success-border);
}

.badge-warning {
  background-color: var(--status-warning-bg);
  color: var(--status-warning);
  border: 1px solid var(--status-warning-border);
}

.badge-critical {
  background-color: var(--status-critical-bg);
  color: var(--status-critical);
  border: 1px solid var(--status-critical-border);
}

.badge-neutral {
  background-color: var(--status-neutral-bg);
  color: var(--status-neutral);
  border: 1px solid var(--status-neutral-border);
}

.badge-info {
  background-color: var(--primary-blue-light);
  color: var(--primary-blue);
  border: 1px solid var(--primary-blue-border);
}

/* Buttons and Links */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s ease-in-out;
  line-height: 1.3;
}

.btn-primary {
  background-color: var(--primary-blue);
  color: #FFFFFF;
}

.btn-primary:hover {
  background-color: var(--primary-blue-hover);
}

.btn-secondary {
  background-color: var(--bg-surface);
  color: var(--text-primary);
  border-color: var(--border-color);
}

.btn-secondary:hover {
  background-color: var(--bg-surface-subtle);
  border-color: #CBD5E1;
}

.btn-danger {
  background-color: #DC2626;
  color: #FFFFFF;
}

.btn-danger:hover {
  background-color: var(--status-critical);
}

.btn-success {
  background-color: #16A34A;
  color: #FFFFFF;
}

.btn-success:hover {
  background-color: var(--status-success);
}

.btn-sm {
  padding: 4px 10px;
  font-size: 12px;
}

.btn svg {
  width: 14px;
  height: 14px;
}

/* Forms and Inputs */
.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}

.form-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
}

.form-label-desc {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 400;
}

.form-control {
  padding: 8px 12px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  font-size: 13px;
  font-family: inherit;
  background-color: #FFFFFF;
  color: var(--text-primary);
  transition: border-color 0.15s ease;
  width: 100%;
}

.form-control:focus {
  outline: none;
  border-color: var(--primary-blue);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

.form-control.mono {
  font-family: var(--font-mono);
}

.form-row {
  display: flex;
  gap: 12px;
  align-items: flex-end;
}

/* Detail Inspection Lists */
.meta-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 12px 20px;
}

.meta-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.meta-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.meta-value {
  font-size: 13px;
  color: var(--text-primary);
}

/* Monospace Code & Report Viewers */
.code-block {
  background-color: #0F172A;
  color: #E2E8F0;
  padding: 16px;
  border-radius: var(--radius-md);
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  overflow-x: auto;
  white-space: pre-wrap;
  border: 1px solid #1E293B;
}

/* Empty States */
.empty-state {
  padding: 36px 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--text-secondary);
}

.empty-state-icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background-color: var(--primary-blue-light);
  color: var(--primary-blue);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
}

.empty-state-icon svg {
  width: 22px;
  height: 22px;
}

.empty-state-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}

.empty-state-desc {
  font-size: 12px;
  color: var(--text-muted);
  max-width: 360px;
}

/* Filter Bar */
.filter-bar {
  background-color: #F8FAFC;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.filter-group label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
}

/* Responsive Rules */
@media (max-width: 992px) {
  .app-sidebar {
    width: 210px;
  }
  .grid-2col, .grid-3col {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 768px) {
  .app-layout {
    flex-direction: column;
  }
  .app-sidebar {
    width: 100%;
    border-right: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .sidebar-nav {
    flex-direction: row;
    flex-wrap: wrap;
    gap: 4px;
  }
  .nav-item {
    font-size: 12px;
    padding: 6px 10px;
  }
  .page-container {
    padding: 16px;
  }
}
</style>
